# Nginx-Konfiguration für datenbanken.ajti.online (hinter Cloudflare Tunnel).
# Liefert nur die Dateien der Lernplattform aus. Alles andere im Repo (.git, deploy/, README, ...) ist gesperrt.
# Die Header entsprechen der Datei _headers (die gilt nur bei Cloudflare Pages).
# Hinweis: add_header steht absichtlich nur hier im server-Block. In location-Blöcken würde es die
# Header von hier überschreiben statt sie zu ergänzen. Für das Caching wird deshalb "expires" benutzt.

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  autoindex off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Alles ist standardmäßig gesperrt (Allowlist) ...
  location / { return 404; }

  # ... und nur das hier wird ausgeliefert:
  location = /           { try_files /index.html =404; }
  location = /index.html { }
  location = /robots.txt { }

  # Inhalte und Code ändern sich beim Weiterentwickeln: immer neu prüfen (Cache-Control: no-cache)
  location ^~ /css/  { expires -1; }
  location ^~ /js/   { expires -1; }
  location ^~ /data/ { expires -1; }

  # SQL-Skripte zum Herunterladen
  location ^~ /sql/  { default_type application/octet-stream; }

  # Einfacher Gesundheitscheck für Docker
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
}
